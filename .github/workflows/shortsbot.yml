name: ai-shortsbot

on:
  schedule:
    - cron: "0 10 * * 1-5"  # 평일 KST 19:00
    - cron: "0 2 * * 0,6"   # 주말 KST 11:00
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg (한글 폰트는 fonts/ 폴더에 포함)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: python main.py
      - name: 게시 이력 커밋 (중복게시 방지 + 프로필 링크 페이지 기록)
        run: |
          git config user.name "ai-shortsbot"
          git config user.email "ai-shortsbot@users.noreply.github.com"
          git add shorts_posted_ids.json posted_videos.json
          git diff --staged --quiet || git commit -m "chore: update shorts_posted_ids"
          git pull --rebase origin main
          git push
      - run: python site_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-bot
    runs-on: ubuntu-latest
    # 저장소 Settings → Pages → Source가 "GitHub Actions"가 아니면 실패한다 — 업로드와는 무관.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
